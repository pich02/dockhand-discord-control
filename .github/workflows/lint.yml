name: Lint

on:
  push:
  pull_request:

jobs:
  ruff-tox-lint:
    name: Ruff lint (tox)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Run lint checks via tox
        run: tox -e lint
