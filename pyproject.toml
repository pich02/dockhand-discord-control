[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dockhand-discord-control"
version = "0.1.0"
description = "Discord bot and Reflex web UI for controlling a self-hosted Dockhand server."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "reflex",
    "discord.py",
    "httpx",
    "pydantic",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pyright",
    "import-linter",
    "pytest",
    "tox",
    "python-socketio[client]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["dockhand_discord_control"]

[[tool.importlinter.contracts]]
name = "Domain is isolated from internal packages"
type = "forbidden"
source_modules = ["dockhand_discord_control.domain"]
forbidden_modules = [
    "dockhand_discord_control.config",
    "dockhand_discord_control.dockhand",
    "dockhand_discord_control.discord",
    "dockhand_discord_control.persistence",
    "dockhand_discord_control.ui",
]

[[tool.importlinter.contracts]]
name = "Adapters depend only on domain"
type = "forbidden"
source_modules = [
    "dockhand_discord_control.dockhand",
    "dockhand_discord_control.discord",
    "dockhand_discord_control.persistence",
]
forbidden_modules = [
    "dockhand_discord_control.config",
    "dockhand_discord_control.ui",
]

[[tool.importlinter.contracts]]
name = "Adapters are independent"
type = "independence"
modules = [
    "dockhand_discord_control.dockhand",
    "dockhand_discord_control.discord",
    "dockhand_discord_control.persistence",
]

[[tool.importlinter.contracts]]
name = "Config has no internal dependencies"
type = "forbidden"
source_modules = ["dockhand_discord_control.config"]
forbidden_modules = [
    "dockhand_discord_control.domain",
    "dockhand_discord_control.dockhand",
    "dockhand_discord_control.discord",
    "dockhand_discord_control.persistence",
    "dockhand_discord_control.ui",
]
