[tox]
envlist = lint,types,test
isolated_build = true

[testenv]
package = wheel

[testenv:lint]
deps =
    ruff
    import-linter
commands =
    ruff check .
    ruff format --check .
    lint-imports

[testenv:types]
deps =
    pyright
commands =
    pyright

[testenv:test]
deps =
    pytest
commands =
    pytest
